<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RescueComm Authority ICCC</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="/static/css/styles.css" />
  </head>
  <body class="dashboard-shell">
    <main class="container-fluid px-3 px-lg-4 py-3">
      <section class="dashboard-topbar mb-3">
        <div>
          <p class="eyebrow mb-1">Integrated Command & Control Centre</p>
          <h1 class="mb-0">RescueComm ICCC</h1>
        </div>
        <div class="topbar-actions">
          <span id="socketBadge" class="badge text-bg-secondary">Connecting</span>
          <a class="btn btn-outline-light" href="/citizen">Citizen Portal</a>
        </div>
      </section>

      <section class="stats-grid mb-3">
        <div class="stat-tile">
          <span>Active</span>
          <strong id="activeCount">0</strong>
        </div>
        <div class="stat-tile">
          <span>Critical</span>
          <strong id="criticalCount">0</strong>
        </div>
        <div class="stat-tile">
          <span>Dispatched</span>
          <strong id="dispatchedCount">0</strong>
        </div>
      </section>

      <div class="row g-3">
        <section class="col-xl-7">
          <div class="command-panel">
            <div class="panel-title text-light">
              <span class="status-dot status-dot-live"></span>
              Live Incident Feed
            </div>
            <div id="emptyState" class="empty-state mt-3">No active incidents.</div>
            <div class="table-responsive mt-3">
              <table class="table table-dark table-hover align-middle incident-table mb-0">
                <thead>
                  <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Category</th>
                    <th scope="col">Severity</th>
                    <th scope="col">Status</th>
                    <th scope="col">Raw Text</th>
                    <th scope="col">Time</th>
                    <th scope="col" class="text-end">Action</th>
                  </tr>
                </thead>
                <tbody id="incidentRows"></tbody>
              </table>
            </div>
          </div>
        </section>

        <section class="col-xl-5">
          <div class="command-panel h-100">
            <div class="panel-title text-light">
              <span class="status-dot"></span>
              Active Incident Map
            </div>
            <div id="dashboardMap" class="map map-dashboard mt-3" aria-label="Authority incident map"></div>
          </div>
        </section>
      </div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/static/js/dashboard.js"></script>
  </body>
</html>
