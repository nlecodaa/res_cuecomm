<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RescueComm Citizen Portal</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="/static/css/styles.css" />
  </head>
  <body class="citizen-shell">
    <main class="container py-4">
      <section class="portal-header mb-4">
        <div>
          <p class="eyebrow mb-1">College Emergency Network</p>
          <h1 class="mb-2">RescueComm</h1>
          <p class="lead mb-0">
            Report an emergency with your live location and watch active campus
            alerts update in real time.
          </p>
        </div>
        <a class="btn btn-outline-primary" href="/dashboard">Authority ICCC</a>
      </section>

      <div class="row g-4 align-items-stretch">
        <section class="col-lg-5">
          <div class="panel h-100">
            <div class="panel-title">
              <span class="status-dot status-dot-live"></span>
              Submit Emergency Report
            </div>
            <form id="reportForm" class="mt-3">
              <label for="rawText" class="form-label">Emergency description</label>
              <textarea
                id="rawText"
                class="form-control form-control-lg"
                rows="7"
                maxlength="1000"
                placeholder="Example: Smoke near the chemistry lab and students are coughing"
                required
              ></textarea>
              <div class="d-flex flex-column flex-sm-row gap-2 mt-3">
                <button id="submitBtn" class="btn btn-primary btn-lg flex-fill" type="submit">
                  Submit Report
                </button>
                <button id="locateBtn" class="btn btn-outline-secondary btn-lg" type="button">
                  Locate Me
                </button>
              </div>
              <p id="formStatus" class="form-status mt-3 mb-0" aria-live="polite"></p>
            </form>
          </div>
        </section>

        <section class="col-lg-7">
          <div class="panel h-100">
            <div class="panel-title">
              <span class="status-dot"></span>
              Active Anonymous Incidents
            </div>
            <div id="citizenMap" class="map map-citizen mt-3" aria-label="Active incident map"></div>
          </div>
        </section>
      </div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/static/js/citizen.js"></script>
  </body>
</html>
